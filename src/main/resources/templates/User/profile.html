<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title data-th-text="${loggedUser.name}">PRofile Page</title>
</head>
<body>

    <div id="content">

        <!-- sidebar -->
        <div th:if="${loggedUser}">
            <div data-th-replace="~{user/sidebar::sidebar}"></div>
         </div>

    <div class="sm:pl-64"  style="height: 1000px; padding-left: 17rem; padding-top: 5rem; justify-content: center;">
        <h3 data-th-text="${loggedUser.name}"> Wel-come to Profile Page  </h3>
        <body class="bg-gray-100">
            <div class="min-h-screen flex items-center justify-center">
                <div class="bg-white shadow-lg rounded-lg overflow-hidden max-w-md w-full">
                    <!-- Profile Cover -->
                    <!-- <div class="bg-gradient-to-r from-blue-500 to-purple-600 h-28"></div> -->
                    <!-- Profile Picture -->
                    <div class="relative -mt-20 mt-5">
                        <img onerror="this.src='https://www.pngarts.com/files/10/Default-Profile-Picture-PNG-Download-Image.png'" class="w-32 h-32 mx-auto rounded-full border-4 border-white shadow-lg"
                        th:src="@{${loggedUser.profilePic}}"  src="https://randomuser.me/api/portraits/women/44.jpg" alt="Profile Picture">
                    </div>
                    <!-- User Info -->
                    <div class="text-center mt-4 p-6">
                        <h1 data-th-text="${loggedUser.name}" class="text-2xl font-bold text-gray-900">Jane Doe</h1>
                        <p data-th-text="${loggedUser.about}" class="text-gray-600 mt-1">Full Stack Developer</p>
        
                        <!-- About -->
                        <p data-th-text="${loggedUser.about}" class="mt-4 text-gray-700">
                            I am a passionate developer with experience in building scalable web applications using the latest technologies.
                        </p>
        
                        <!-- Contact Info -->
                        <div class="mt-6 space-y-3 text-left">
                            <!-- Email -->
                            <div class="flex items-center space-x-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12v.01M12 16v.01M8 12v.01M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <a data-th-text="${loggedUser.email}"  href="mailto:jane.doe@example.com" class="text-gray-600 hover:text-blue-500">jane.doe@example.com</a>
                            </div>
        
                            <!-- Mobile -->
                            <div class="flex items-center space-x-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7-2m0 0L9 4a9 9 0 119 9l-2-1M10 6v2a2 2 0 00-2 2v0a2 2 0 002 2v0a2 2 0 012 2v2m4 0h1m1 0h1" />
                                </svg>
                                <p data-th-text="${loggedUser.mobileNumber}" class="text-gray-600">+123 456 7890</p>
                            </div>
        
                            <!-- Address -->
                            <div class="flex items-center space-x-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10l1.5 1.5M4 18V10a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2h-5m-1 0v-1m-2 1v-4a2 2 0 00-2-2m2 2H8m4 4v2a2 2 0 01-2 2v0a2 2 0 01-2-2v-2" />
                                </svg>
                                <p class="text-gray-600">123 Main Street, Cityville, USA</p>
                            </div>
        
                            <!-- Website -->
                            <div class="flex items-center space-x-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v2m0 4v2m0 4v2m8-6v2a8 8 0 01-16 0v-2a8 8 0 0116 0z" />
                                </svg>
                                <a href="https://janedoe.com" class="text-gray-600 hover:text-blue-500" target="_blank">www.janedoe.com</a>
                            </div>
                        </div>
        
                        <!-- Profile Buttons -->
                        <div class="mt-6 flex justify-center space-x-4">
                            <button class="bg-blue-500 text-white px-4 py-2 rounded-full hover:bg-blue-600 transition">
                                Follow
                            </button>
                            <button class="bg-gray-200 text-gray-900 px-4 py-2 rounded-full hover:bg-gray-300 transition">
                                Message
                            </button>
                        </div>
                    </div>
                </div>
            </div>
    </div>


</div>
    <script>
        console.log("Profile Page...")
    </script>
</body>
</html>
