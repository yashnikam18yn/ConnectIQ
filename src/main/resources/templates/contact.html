<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title>Contact Page</title>
</head>
<body>
<div id="content">

    <!-- Contact Page -->
    <section class="bg-gradient-to-r from-indigo-500 to-blue-600 dark:from-gray-700 dark:to-gray-800 text-black dark:text-white py-20 pb-48">
    <div class="container mx-auto text-center px-4">
        <h1 class="text-4xl font-bold mb-4 text-black">Contact Us</h1>
        <p class="text-lg mb-6 dark:text-black">We would love to hear from you! Feel free to reach out with any questions, feedback, or support needs.</p>
    </div>
</section>


    <section class="flex justify-center mt-32 py-16 px-4">
        <div class="container grid gap-8 grid-cols-1 md:grid-cols-2">
            <!-- Contact Details -->
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-md p-6">
                <h3 class="text-xl font-bold mb-2">Get in Touch</h3>
                <p class="text-gray-600 dark:text-gray-400">Email us at <a href="mailto:yashnikam1831@gmail.com" class="text-indigo-500 dark:text-indigo-400">yashnikam1831@gmail.com</a> or call us at <span class="text-indigo-500 dark:text-indigo-400">+91 9370012323</span>.</p>
            </div>

            <!-- Contact Form -->
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg shadow-md p-6">
                <h3 class="text-xl font-bold mb-4">Send Us a Message</h3>
                <form action="#" method="POST">
                    <div class="mb-4">
                        <label for="name" class="block text-gray-600 dark:text-gray-400 mb-2" placeholder="Enter your name">Your Name</label>
                        <input type="text" id="name" name="name" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-gray-600 dark:text-gray-400 mb-2">Your Email</label>
                        <input type="email" id="email" name="email" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md">
                    </div>
                    <div class="mb-4">
                        <label for="message" class="block text-gray-600 dark:text-gray-400 mb-2">Your Message</label>
                        <textarea id="message" name="message" rows="4" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md"></textarea>
                    </div>
                    <button type="submit" class="bg-indigo-600 text-white py-2 px-4 rounded-lg hover:bg-indigo-500 transition">Submit</button>
                </form>
            </div>
        </div>
    </section>

</div>
<script>
        console.log("Contact Page...")
    </script>
</body>
</html>
