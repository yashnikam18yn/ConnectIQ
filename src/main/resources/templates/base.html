<!DOCTYPE html>
<html class="light" lang="en" th:fragment="parent(content,title,script)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-th-replace="${title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css" rel="stylesheet" />
    
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="dark:bg-gray-900 dark:text-white">

    <!-- if user is login -->
     <div th:if="${loggedUser}">
        <div data-th-replace="~{user/user_navbar::user-navbar}"></div>
     </div>

    <!-- if user is logged in : sidebar -->
    

    <!-- if user is not login -->
     <div th:unless="${loggedUser}">
        <div data-th-replace="~{navbar :: navbarcomponent}">
        </div>
     </div>
    
    <!-- main content -->
     <div>
        <section data-th-replace="${content}"></section>
     </div>
     




    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js"></script>
    <script data-th-src="@{'/JS/script.js'}">

    </script>
    <th:block data-th-replace="${script}">

    </th:block>
</body>
</html>
